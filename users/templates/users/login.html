{% extends "base.html" %}

{% load static %}

{% block title %}Giriş Yap{% endblock title %}

{% block content %}
  <div class="merkez">
    <a href="{% url "homepage" %}" class="geri">← Anasayfa</a>
    
    <div class="kart-form">
      <div class="logo">Hesap<span class="turuncu">Pro</span></div>
      <p class="baslik">Hesabınıza giriş yapın</p>
   
      <form method="post" id="girisForm">
        {% csrf_token %}
        <div class="alan">
          <label>E-posta</label>
          <input name="email" type="email" required>
        </div>
        <div class="alan">
          <label>Şifre</label>
          <input name="password" type="password" required>
        </div>
        <button type="submit" class="btn-form">Giriş Yap</button>
      </form>
   
      <p class="alt-link">Hesabın yok mu? <a href="{% url "sign" %}">Kayıt Ol</a></p>
    </div>
  </div>
{% endblock content %}
